</span><span class="firstviewStart-module__OgwLCG__letter">l</span><span class="firstviewStart-module__OgwLCG__letter">i</span><span class="firstviewStart-module__OgwLCG__letter">c</span><span class="firstviewStart-module__OgwLCG__letter">k</span><span class="firstviewStart-module__OgwLCG__letter">&amp;</span><span class="firstviewStart-module__OgwLCG__letter">S</span><span class="firstviewStart-module__OgwLCG__letter">t</span><span class="firstviewStart-module__OgwLCG__letter">a</span><span class="firstviewStart-module__OgwLCG__letter">r</span><span class="firstviewStart-module__OgwLCG__letter">t</span><span class="firstviewStart-module__OgwLCG__letter">!</span><span class="firstviewStart-module__OgwLCG__letter">!</span></div></div></div><div class="TheAudio"><audio id="sound" src="/static/click.mp3" preload="auto"></audio><audio id="bgm" src="/static/bgm.mp3" loop="" preload="auto"></audio></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"contributing-to-next","title":"Contributing to Next.js: What I Learned","date":"2026-08-05","tag":"Open Source","content":"\n# Contributing to Next.js: What I Learned\n\n\u003e A contribution to [Vercel/Next.js](\u003chttps://github.com/vercel/next.js\u003e) addressing [Issue #96241](\u003chttps://github.com/vercel/next.js/issues/96241\u003e).\n\n## Overview\n\nThis contribution request was to add a startup warning to the Next.js development server when the printed **Network URL** may be inaccessible because of cross-origin restrictions.\n\n- **Issue:** [#96241](\u003chttps://github.com/vercel/next.js/issues/96241\u003e)\n- **Pull Request:** #96283\n- **Repository:** [vercel/next.js](\u003chttps://github.com/vercel/next.js\u003e)\n\nLicense Note: Next.js is released under the [MIT License](\u003chttps://github.com/vercel/next.js/blob/canary/license.md\u003e), an OSI-approved open-source license.\n\nThe primary purpose of the PR is to address an existing bug reported by another developer, **mhverbakel**, in [Issue #96241](\u003chttps://github.com/vercel/next.js/issues/96241\u003e).\n\n---\n\n## What Changed?\n\nWhen running Next.js in development mode, `next dev` prints two URLs:\n\n```\nLocal:   http://localhost:3000\nNetwork: http://192.168.1.2:3000\n```\n\nBefore this change, attempting to access the Network URL could fail because of Next.js' cross-origin restrictions.\n\nThe behavior could be confusing because:\n\n- The Network URL was displayed normally.\n- The page could fail to load when accessed through that URL.\n- HMR would not function correctly.\n- The relevant warning was only visible later in the browser console.\n- The terminal output did not immediately explain the problem or its solution.\n\n## The Fix\n\nMy PR adds a warning directly to the development server's startup output.\n\nThe warning appears immediately after the Network URL is printed and explains:\n\n- Why the Network URL may not work.\n- That cross-origin access is restricted by default.\n- That `allowedDevOrigins` can be configured to permit the required origin.\n\n### Implementation\n\nThe change was limited to a single file:\n\n```\npackages/next/src/server/lib/app-info-log.ts\n```\n\nI added a `logAllowedDevOriginsInfo` function inside `logStartInfo` and called it immediately after the Network URL is logged.\n\nConceptually, the startup flow now looks like:\n\n```\nStart Next.js development server\n      ↓\nPrint Local URL\n      ↓\nPrint Network URL\n      ↓\nPrint allowedDevOrigins information\n```\n\nThis puts the explanation next to the Network URL instead of requiring the developer to discover the problem through the browser console.\n\n---\n\n## Course Context\n\nThis contribution was built on knowledge and experience developed throughout **OSU's CS 464**.\n\nTwo assignments were particularly relevant:\n\n- **Report: Testing Methodology and Results**\n- **Open or Claim an Issue and Submit the Link**\n\n### Testing Methodology and Results\n\nThe Next.js page I reviewed for the Testing Methodology and Results assignment was not directly related to this PR. However, the assignment introduced me to the structure of the Next.js repository and gave me experience working with **TypeScript**.\n\nBefore taking CS 464, I had no previous experience with TypeScript or Next.js. The earlier code review therefore gave me useful background when navigating the repository for this contribution.\n\n### Open or Claim an Issue\n\nThe Issue Link assignment had a more direct impact on this PR.\n\nThrough that assignment, I learned about:\n\n- Next.js contribution guidelines\n- Building the Next.js repository\n- Running Next.js in different modes\n- Creating and running tests\n- Finding relevant files in the repository\n- The process for opening and submitting a pull request\n\nBecause I had already worked with the repository during the earlier assignment, I had a better idea of where to begin investigating this issue.\n\nFor this PR, I knew that the problem was related to the development server and was therefore able to narrow my investigation toward the relevant server-side files.\n\n---\n\n## Contribution Process\n\n### 1\\. Finding an Existing Issue\n\nI chose to work on an existing issue rather than creating a new issue.\n\nBefore starting work on [#96241](\u003chttps://github.com/vercel/next.js/issues/96241\u003e), I checked the issue's comments to make sure that another contributor had not already claimed it.\n\nAt the time I began working on it, no contributor other than the original poster had claimed the issue.\n\n### 2\\. Reproducing the Issue\n\nI first reproduced the reported behavior locally and confirmed that the Network URL could not be used as expected without additional configuration.\n\nI then communicated with the original issue author, letting them know that I was able to reproduce the problem and intended to investigate a solution.\n\n### 3\\. Investigating the Proposed Fix\n\nThe issue initially suggested allowing `networkHostname` to work without requiring users to configure `allowedDevOrigins`.\n\nWhile investigating the source code, I found the existing [`allowedDevOrigins` documentation](\u003chttps://nextjs.org/docs/app/api-reference/config/next-config-js/allowedDevOrigins\u003e).\n\nThe documentation clarified that the current behavior was intentional.\n\nBecause of this, I changed my approach. Rather than changing the existing security behavior, I implemented the alternative solution described in the issue: **improve the developer-facing messaging**.\n\nThe resulting change explains to developers why the Network URL is restricted and points them toward the configuration required to use it.\n\n---\n\n## Following Project Guidelines\n\nI also followed the contribution process documented by the Next.js project.\n\n### Contribution Guide\n\nThe [Next.js contribution guide](\u003chttps://nextjs.org/docs/community/contribution-guide\u003e) recommends that contributors understand GitHub's open-source contribution practices.\n\nI followed this process by:\n\n- Finding an existing issue.\n- Checking whether another contributor was already working on it.\n- Communicating with the issue author.\n- Investigating the existing implementation and documentation.\n- Searching for related pull requests.\n- Following the repository's contribution requirements.\n\n### `contributing.md`\n\nThe Next.js repository also contains a [`contributing.md`](\u003chttps://github.com/vercel/next.js/blob/canary/contributing.md\u003e) file describing project-specific contribution procedures.\n\nThe guide recommends checking existing issues and pull requests before beginning work. I searched existing PRs to ensure that there was not already a contribution addressing Issue #96241 or the same underlying problem.\n\nI also watched the project's contribution walkthrough, **“How to Contribute to Open Source (Next.js)”**, which explains the expected contribution workflow.\n\n---\n\n## Commit Signing\n\nThe Next.js contribution guide requires commits targeting protected branches to be signed using a GitHub-verified:\n\n- GPG key\n- SSH key\n- S/MIME key\n\nSince my PR targeted changes related to the protected `canary` branch, I configured **SSH commit signing** for my GitHub account.\n\nThis allowed my commits to satisfy the repository's signed-commit requirements.\n\n---\n\n## Pull Request\n\nNext.js provides different PR templates depending on the type of contribution.\n\nBecause this was a bug fix, I structured my PR around three questions:\n\n```\nWhat changed?\nWhy was it changed?\nHow was it changed?\n```\n\nThe PR explains the reported problem, the reasoning behind the solution, and the specific implementation used to address it.\n\n**PR:** #96283\n\n---\n\n## Validation\n\nBefore submitting the PR, I ran the formatting and linting commands recommended by the project:\n\n```\npnpm prettier-fix\npnpm lint-fix\n```\n\nThe PR successfully passed the automated checks configured by the Next.js repository.\n\nAt the time of writing, the remaining requirement for merging is **review and approval from a member of the Next.js team**.\n\n---\n\n## References\n\n- mhverbakel. “[Network URL shown at startup is not accessible without allowedDevOrigins.](\u003chttps://github.com/vercel/next.js/issues/96241\u003e)” _GitHub Issues_, Vercel/next.js, Issue #96241. Accessed July 2026.\n- “[Next.js](\u003chttps://github.com/vercel/next.js\u003e).” _GitHub_. Accessed July 27, 2026.\n- “[Next.js](\u003chttps://nextjs.org/\u003e).” _Next.js_. Accessed July 27, 2026.\n\n\u003e **Note:** Most sources I referenced for this were pages within the official Next.js website and their GitHub repository. To avoid repeating the same project in the references, only the primary website and repository are listed above.\n","contentHtml":"\u003ch1\u003eContributing to Next.js: What I Learned\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003eA contribution to \u003ca href=\"https://github.com/vercel/next.js\"\u003eVercel/Next.js\u003c/a\u003e addressing \u003ca href=\"https://github.com/vercel/next.js/issues/96241\"\u003eIssue #96241\u003c/a\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2\u003eOverview\u003c/h2\u003e\n\u003cp\u003eThis contribution request was to add a startup warning to the Next.js development server when the printed \u003cstrong\u003eNetwork URL\u003c/strong\u003e may be inaccessible because of cross-origin restrictions.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eIssue:\u003c/strong\u003e \u003ca href=\"https://github.com/vercel/next.js/issues/96241\"\u003e#96241\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePull Request:\u003c/strong\u003e #96283\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRepository:\u003c/strong\u003e \u003ca href=\"https://github.com/vercel/next.js\"\u003evercel/next.js\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLicense Note: Next.js is released under the \u003ca href=\"https://github.com/vercel/next.js/blob/canary/license.md\"\u003eMIT License\u003c/a\u003e, an OSI-approved open-source license.\u003c/p\u003e\n\u003cp\u003eThe primary purpose of the PR is to address an existing bug reported by another developer, \u003cstrong\u003emhverbakel\u003c/strong\u003e, in \u003ca href=\"https://github.com/vercel/next.js/issues/96241\"\u003eIssue #96241\u003c/a\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eWhat Changed?\u003c/h2\u003e\n\u003cp\u003eWhen running Next.js in development mode, \u003ccode\u003enext dev\u003c/code\u003e prints two URLs:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eLocal:   http://localhost:3000\nNetwork: http://192.168.1.2:3000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBefore this change, attempting to access the Network URL could fail because of Next.js' cross-origin restrictions.\u003c/p\u003e\n\u003cp\u003eThe behavior could be confusing because:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe Network URL was displayed normally.\u003c/li\u003e\n\u003cli\u003eThe page could fail to load when accessed through that URL.\u003c/li\u003e\n\u003cli\u003eHMR would not function correctly.\u003c/li\u003e\n\u003cli\u003eThe relevant warning was only visible later in the browser console.\u003c/li\u003e\n\u003cli\u003eThe terminal output did not immediately explain the problem or its solution.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eThe Fix\u003c/h2\u003e\n\u003cp\u003eMy PR adds a warning directly to the development server's startup output.\u003c/p\u003e\n\u003cp\u003eThe warning appears immediately after the Network URL is printed and explains:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWhy the Network URL may not work.\u003c/li\u003e\n\u003cli\u003eThat cross-origin access is restricted by default.\u003c/li\u003e\n\u003cli\u003eThat \u003ccode\u003eallowedDevOrigins\u003c/code\u003e can be configured to permit the required origin.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eImplementation\u003c/h3\u003e\n\u003cp\u003eThe change was limited to a single file:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epackages/next/src/server/lib/app-info-log.ts\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eI added a \u003ccode\u003elogAllowedDevOriginsInfo\u003c/code\u003e function inside \u003ccode\u003elogStartInfo\u003c/code\u003e and called it immediately after the Network URL is logged.\u003c/p\u003e\n\u003cp\u003eConceptually, the startup flow now looks like:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eStart Next.js development server\n      ↓\nPrint Local URL\n      ↓\nPrint Network URL\n      ↓\nPrint allowedDevOrigins information\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThis puts the explanation next to the Network URL instead of requiring the developer to discover the problem through the browser console.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eCourse Context\u003c/h2\u003e\n\u003cp\u003eThis contribution was built on knowledge and experience developed throughout \u003cstrong\u003eOSU's CS 464\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eTwo assignments were particularly relevant:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eReport: Testing Methodology and Results\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOpen or Claim an Issue and Submit the Link\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eTesting Methodology and Results\u003c/h3\u003e\n\u003cp\u003eThe Next.js page I reviewed for the Testing Methodology and Results assignment was not directly related to this PR. However, the assignment introduced me to the structure of the Next.js repository and gave me experience working with \u003cstrong\u003eTypeScript\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eBefore taking CS 464, I had no previous experience with TypeScript or Next.js. The earlier code review therefore gave me useful background when navigating the repository for this contribution.\u003c/p\u003e\n\u003ch3\u003eOpen or Claim an Issue\u003c/h3\u003e\n\u003cp\u003eThe Issue Link assignment had a more direct impact on this PR.\u003c/p\u003e\n\u003cp\u003eThrough that assignment, I learned about:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNext.js contribution guidelines\u003c/li\u003e\n\u003cli\u003eBuilding the Next.js repository\u003c/li\u003e\n\u003cli\u003eRunning Next.js in different modes\u003c/li\u003e\n\u003cli\u003eCreating and running tests\u003c/li\u003e\n\u003cli\u003eFinding relevant files in the repository\u003c/li\u003e\n\u003cli\u003eThe process for opening and submitting a pull request\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBecause I had already worked with the repository during the earlier assignment, I had a better idea of where to begin investigating this issue.\u003c/p\u003e\n\u003cp\u003eFor this PR, I knew that the problem was related to the development server and was therefore able to narrow my investigation toward the relevant server-side files.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eContribution Process\u003c/h2\u003e\n\u003ch3\u003e1. Finding an Existing Issue\u003c/h3\u003e\n\u003cp\u003eI chose to work on an existing issue rather than creating a new issue.\u003c/p\u003e\n\u003cp\u003eBefore starting work on \u003ca href=\"https://github.com/vercel/next.js/issues/96241\"\u003e#96241\u003c/a\u003e, I checked the issue's comments to make sure that another contributor had not already claimed it.\u003c/p\u003e\n\u003cp\u003eAt the time I began working on it, no contributor other than the original poster had claimed the issue.\u003c/p\u003e\n\u003ch3\u003e2. Reproducing the Issue\u003c/h3\u003e\n\u003cp\u003eI first reproduced the reported behavior locally and confirmed that the Network URL could not be used as expected without additional configuration.\u003c/p\u003e\n\u003cp\u003eI then communicated with the original issue author, letting them know that I was able to reproduce the problem and intended to investigate a solution.\u003c/p\u003e\n\u003ch3\u003e3. Investigating the Proposed Fix\u003c/h3\u003e\n\u003cp\u003eThe issue initially suggested allowing \u003ccode\u003enetworkHostname\u003c/code\u003e to work without requiring users to configure \u003ccode\u003eallowedDevOrigins\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eWhile investigating the source code, I found the existing \u003ca href=\"https://nextjs.org/docs/app/api-reference/config/next-config-js/allowedDevOrigins\"\u003e\u003ccode\u003eallowedDevOrigins\u003c/code\u003e documentation\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eThe documentation clarified that the current behavior was intentional.\u003c/p\u003e\n\u003cp\u003eBecause of this, I changed my approach. Rather than changing the existing security behavior, I implemented the alternative solution described in the issue: \u003cstrong\u003eimprove the developer-facing messaging\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThe resulting change explains to developers why the Network URL is restricted and points them toward the configuration required to use it.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eFollowing Project Guidelines\u003c/h2\u003e\n\u003cp\u003eI also followed the contribution process documented by the Next.js project.\u003c/p\u003e\n\u003ch3\u003eContribution Guide\u003c/h3\u003e\n\u003cp\u003eThe \u003ca href=\"https://nextjs.org/docs/community/contribution-guide\"\u003eNext.js contribution guide\u003c/a\u003e recommends that contributors understand GitHub's open-source contribution practices.\u003c/p\u003e\n\u003cp\u003eI followed this process by:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFinding an existing issue.\u003c/li\u003e\n\u003cli\u003eChecking whether another contributor was already working on it.\u003c/li\u003e\n\u003cli\u003eCommunicating with the issue author.\u003c/li\u003e\n\u003cli\u003eInvestigating the existing implementation and documentation.\u003c/li\u003e\n\u003cli\u003eSearching for related pull requests.\u003c/li\u003e\n\u003cli\u003eFollowing the repository's contribution requirements.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e\u003ccode\u003econtributing.md\u003c/code\u003e\u003c/h3\u003e\n\u003cp\u003eThe Next.js repository also contains a \u003ca href=\"https://github.com/vercel/next.js/blob/canary/contributing.md\"\u003e\u003ccode\u003econtributing.md\u003c/code\u003e\u003c/a\u003e file describing project-specific contribution procedures.\u003c/p\u003e\n\u003cp\u003eThe guide recommends checking existing issues and pull requests before beginning work. I searched existing PRs to ensure that there was not already a contribution addressing Issue #96241 or the same underlying problem.\u003c/p\u003e\n\u003cp\u003eI also watched the project's contribution walkthrough, \u003cstrong\u003e“How to Contribute to Open Source (Next.js)”\u003c/strong\u003e, which explains the expected contribution workflow.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eCommit Signing\u003c/h2\u003e\n\u003cp\u003eThe Next.js contribution guide requires commits targeting protected branches to be signed using a GitHub-verified:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGPG key\u003c/li\u003e\n\u003cli\u003eSSH key\u003c/li\u003e\n\u003cli\u003eS/MIME key\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSince my PR targeted changes related to the protected \u003ccode\u003ecanary\u003c/code\u003e branch, I configured \u003cstrong\u003eSSH commit signing\u003c/strong\u003e for my GitHub account.\u003c/p\u003e\n\u003cp\u003eThis allowed my commits to satisfy the repository's signed-commit requirements.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003ePull Request\u003c/h2\u003e\n\u003cp\u003eNext.js provides different PR templates depending on the type of contribution.\u003c/p\u003e\n\u003cp\u003eBecause this was a bug fix, I structured my PR around three questions:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWhat changed?\nWhy was it changed?\nHow was it changed?\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe PR explains the reported problem, the reasoning behind the solution, and the specific implementation used to address it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePR:\u003c/strong\u003e #96283\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eValidation\u003c/h2\u003e\n\u003cp\u003eBefore submitting the PR, I ran the formatting and linting commands recommended by the project:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epnpm prettier-fix\npnpm lint-fix\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe PR successfully passed the automated checks configured by the Next.js repository.\u003c/p\u003e\n\u003cp\u003eAt the time of writing, the remaining requirement for merging is \u003cstrong\u003ereview and approval from a member of the Next.js team\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eReferences\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003emhverbakel. “\u003ca href=\"https://github.com/vercel/next.js/issues/96241\"\u003eNetwork URL shown at startup is not accessible without allowedDevOrigins.\u003c/a\u003e” \u003cem\u003eGitHub Issues\u003c/em\u003e, Vercel/next.js, Issue #96241. Accessed July 2026.\u003c/li\u003e\n\u003cli\u003e“\u003ca href=\"https://github.com/vercel/next.js\"\u003eNext.js\u003c/a\u003e.” \u003cem\u003eGitHub\u003c/em\u003e. Accessed July 27, 2026.\u003c/li\u003e\n\u003cli\u003e“\u003ca href=\"https://nextjs.org/\"\u003eNext.js\u003c/a\u003e.” \u003cem\u003eNext.js\u003c/em\u003e. Accessed July 27, 2026.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eNote:\u003c/strong\u003e Most sources I referenced for this were pages within the official Next.js website and their GitHub repository. To avoid repeating the same project in the references, only the primary website and repository are listed above.\u003c/p\u003e\n\u003c/blockquote\u003e\n"}},"__N_SSG":true},"page":"/posts/[id]","query":{"id":"contributing-to-next"},"buildId":"LF-CMqqOqg8-c4ohaX8dw","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
