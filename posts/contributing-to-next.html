ddleware-rewrite']) {\n  // ...\n} else if (middlewareHeaders['location']) {\n  // ...\n}","contentHtml":"\u003cp\u003eMy first real open-source contribution came out of a class assignment that asked me to read a large codebase and find something to fix. I ended up going much deeper than expected.\u003c/p\u003e\n\u003ch2\u003eFinding the Bug\u003c/h2\u003e\n\u003cp\u003eThe issue was straightforward to reproduce: in standalone mode, \u003ccode\u003eNextResponse.rewrite()\u003c/code\u003e from middleware produced a 307 redirect instead of being processed internally.\u003c/p\u003e\n\u003cp\u003eThe dev server worked fine. Production deployments hit an infinite redirect loop.\u003c/p\u003e\n\u003cp\u003eThe root cause turned out to be in \u003ccode\u003eresolve-routes.ts\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003eThe Fix\u003c/h2\u003e\n\u003cp\u003eOne word: \u003ccode\u003eelse\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eChanging the second block from a standalone \u003ccode\u003eif\u003c/code\u003e to \u003ccode\u003eelse if\u003c/code\u003e made the location block mutually exclusive with the rewrite block.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-ts\"\u003e// Before\nif (middlewareHeaders['x-middleware-rewrite']) {\n  // ...\n}\n\nif (middlewareHeaders['location']) {\n  // ...\n}\n\n// After\nif (middlewareHeaders['x-middleware-rewrite']) {\n  // ...\n} else if (middlewareHeaders['location']) {\n  // ...\n}\n\u003c/code\u003e\u003c/pre\u003e\n"}},"__N_SSG":true},"page":"/posts/[id]","query":{"id":"contributing-to-next"},"buildId":"5_haW2FO-NOdj_CJF0V-X","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
