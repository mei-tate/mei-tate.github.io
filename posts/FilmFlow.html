</span><span class="firstviewStart-module__OgwLCG__letter">l</span><span class="firstviewStart-module__OgwLCG__letter">i</span><span class="firstviewStart-module__OgwLCG__letter">c</span><span class="firstviewStart-module__OgwLCG__letter">k</span><span class="firstviewStart-module__OgwLCG__letter">&amp;</span><span class="firstviewStart-module__OgwLCG__letter">S</span><span class="firstviewStart-module__OgwLCG__letter">t</span><span class="firstviewStart-module__OgwLCG__letter">a</span><span class="firstviewStart-module__OgwLCG__letter">r</span><span class="firstviewStart-module__OgwLCG__letter">t</span><span class="firstviewStart-module__OgwLCG__letter">!</span><span class="firstviewStart-module__OgwLCG__letter">!</span></div></div></div><div class="TheAudio"><audio id="sound" src="/static/click.mp3" preload="auto"></audio><audio id="bgm" src="/static/bgm.mp3" loop="" preload="auto"></audio></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"FilmFlow","title":"FilmFlow","date":"2026-05-21","tag":"Projects","content":"\n# FilmFlow: Movie Playlist Generator\n\nFilmFlow is a full-stack web application that makes it easier to discover and listen to the music from movies. The application allows users to search for a movie, find its soundtrack, select songs, and create playlists from those songs.\n\n\n[Click here to view the source code on GitHub](https://github.com/mei-tate/FilmFlow)\n\n---\n\n## My Role\n\nI worked on FilmFlow as a full-stack developer, contributing entirely to both the frontend and backend of the application. My work included implementing the user-facing interface, connecting external APIs, handling authentication, and building the functionality that connects movie soundtrack information to Spotify.\n\nA major part of the project involved making several independent services work together. FilmFlow uses TMDB to search for movies, Wikipedia to retrieve soundtrack information, and Spotify to create playlists. The backend also manages user accounts and application data through MongoDB.\n\n---\n\n## The Problem\n\nMovie soundtracks are often spread across different sources. A user might find a movie through a search engine, look up its soundtrack on another website, search for each song on Spotify, and then manually create a playlist.\n\nFilmFlow simplifies this process by combining those steps into one application:\n\n**Movie → Soundtrack → Spotify Playlist**\n\nThe goal was not just to display soundtrack information, but to create a complete workflow that turns that information into something users can immediately listen to.\n\nWhen developing FilmFlow, the initial idea of simply creating playlists from a single movie’s track list felt too restrictive. FilmFlow therefore expands users’ creative freedom by allowing them to combine songs from multiple movies into a single playlist that they can name.\n\n---\n\n## How FilmFlow Works\n\nWhen the website is running, the main action starts when a user searches for a movie. FilmFlow sends the search request to the **TMDB API**, which provides movie information and search results.\n\nAfter selecting a movie, FilmFlow uses the **Wikipedia API** to find the movie's soundtrack information. The soundtrack data is then processed so that individual songs can be matched with tracks available on Spotify.\n\nOnce the user connects their Spotify account, FilmFlow uses the **Spotify Web API** to create a playlist containing the soundtrack songs.\n\nThis creates a multi-service workflow where each API has a specific responsibility:\n\n* **TMDB** provides movie search and movie information.\n* **Wikipedia** provides soundtrack information.\n* **Spotify** provides music search and playlist creation.\n* **MongoDB** stores application and user information.\n* **Express** handles server-side requests and application logic.\n* **React** provides the interactive frontend.\n\n---\n\n## Major Features\n\n### User Authentication\n\nFilmFlow includes email and password authentication so users can have accounts within the application. Authentication required managing user credentials and protecting information that should not be publicly accessible.\n\n### Movie Search\n\nUsers can search for movies through TMDB rather than manually entering movie information. Search results provide a more convenient way to find the movie they want to use.\n\n### Soundtrack Discovery\n\nAfter selecting a movie, FilmFlow retrieves soundtrack information through Wikipedia. This was particularly useful because soundtrack information is not provided directly by TMDB.\n\n### Spotify Integration\n\nUsers can connect their Spotify account to FilmFlow. The application uses Spotify's API to search for tracks and create playlists on the user's account.\n\n### Playlist Creation\n\nThe final workflow is designed to require as little manual work as possible. After selecting a movie and connecting Spotify, users can create a playlist containing any of the songs from a single or multiple movie's soundtrack.\n\n---\n\n## Technologies Used\n\nFilmFlow was built with the **MERN stack** and several external APIs.\n\n* **React** — frontend interface and application state\n* **Node.js** — server-side JavaScript runtime\n* **Express** — backend API and server framework\n* **MongoDB** — database for application data\n* **Spotify Web API** — Spotify authentication, track searching, and playlist creation\n* **TMDB API** — movie searching and movie information\n* **Wikipedia API** — soundtrack information\n* **JavaScript** — primary programming language\n* **Git/GitHub** — version control and source management\n\nThe project gave me experience working with a traditional client-server architecture while also integrating several third-party services into the same application.\n\n---\n\n## Challenges\n\nOne of the biggest challenges was integrating APIs that were designed for different purposes. TMDB provides structured movie data, while Wikipedia contains soundtrack information in a much less predictable format. Spotify then requires its own authentication process and specific information about tracks and playlists.\n\nThe Spotify integration was another significant challenge because it required OAuth authentication. The application had to correctly handle the connection between the user's FilmFlow session and their Spotify account before it could make requests on their behalf.\n\nAnother challenge was matching soundtrack information to Spotify tracks. Song titles and artist names do not always have identical formatting across different sources, so data retrieved from Wikipedia could not simply be passed directly to Spotify. The application needed to account for differences in how information was represented by each service.\n\nWorking with authentication also reinforced the importance of configuration details. For example, Spotify requires the application's redirect URI to exactly match the URI registered with the Spotify developer application. Small configuration differences can prevent authentication from working correctly.\n\n---\n\n## What I Learned\n\nFilmFlow gave me practical experience building a full-stack application rather than working on the frontend or backend in isolation. I learned how the different parts of a MERN application communicate and how frontend actions can trigger backend requests and external API calls.\n\nThe project also taught me more about working with third-party APIs. Documentation, authentication requirements, response formats, and error handling all become important when an application depends on services outside of its own codebase.\n\nOAuth was another important area of learning. Integrating Spotify required understanding how an application obtains permission to interact with a user's account and how that authorization is used when making API requests.\n\nMost importantly, FilmFlow showed me that API integration is not just about sending requests and receiving data. Different services often represent the same information differently, so building a reliable application requires transforming, validating, and connecting that data between systems.\n\n### Microservice Architecture\n\nFilmFlow was originally developed as a project for my Software Engineering 1 course at OSU, where the focus was on designing and implementing software that uses the microservices architecture. As such while the version of FilmFlow linked here does't use any of the original code from my peers microservices, there are features within the code on the server side that were based off of integrating microservice, this includes the movie bookmark functionality, the user feedback page, the password generator, and code that counts the number of songs in a playlist.\n\n---\n\n## Reflection\n\nFilmFlow started as a relatively simple idea—turn a movie soundtrack into a Spotify playlist—but implementing that idea required several different technologies to work together. The project strengthened my experience with React, Express, MongoDB, authentication, and REST APIs while giving me a better understanding of how full-stack applications integrate with external services.\n\nThe project also reflects my interest in building applications that combine engineering with usability. Rather than requiring users to understand how the underlying APIs work, FilmFlow hides that complexity behind a straightforward workflow: find a movie, discover its soundtrack, and create a playlist.\n\n---\n\n## Project\n\n**Repository:** [github.com/mei-tate/FilmFlow](https://github.com/mei-tate/FilmFlow)\n\n## **Author:** Mei Tate\n","contentHtml":"\u003ch1\u003eFilmFlow: Movie Playlist Generator\u003c/h1\u003e\n\u003cp\u003eFilmFlow is a full-stack web application that makes it easier to discover and listen to the music from movies. The application allows users to search for a movie, find its soundtrack, select songs, and create playlists from those songs.\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/mei-tate/FilmFlow\"\u003eClick here to view the source code on GitHub\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eMy Role\u003c/h2\u003e\n\u003cp\u003eI worked on FilmFlow as a full-stack developer, contributing entirely to both the frontend and backend of the application. My work included implementing the user-facing interface, connecting external APIs, handling authentication, and building the functionality that connects movie soundtrack information to Spotify.\u003c/p\u003e\n\u003cp\u003eA major part of the project involved making several independent services work together. FilmFlow uses TMDB to search for movies, Wikipedia to retrieve soundtrack information, and Spotify to create playlists. The backend also manages user accounts and application data through MongoDB.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eThe Problem\u003c/h2\u003e\n\u003cp\u003eMovie soundtracks are often spread across different sources. A user might find a movie through a search engine, look up its soundtrack on another website, search for each song on Spotify, and then manually create a playlist.\u003c/p\u003e\n\u003cp\u003eFilmFlow simplifies this process by combining those steps into one application:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMovie → Soundtrack → Spotify Playlist\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe goal was not just to display soundtrack information, but to create a complete workflow that turns that information into something users can immediately listen to.\u003c/p\u003e\n\u003cp\u003eWhen developing FilmFlow, the initial idea of simply creating playlists from a single movie’s track list felt too restrictive. FilmFlow therefore expands users’ creative freedom by allowing them to combine songs from multiple movies into a single playlist that they can name.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eHow FilmFlow Works\u003c/h2\u003e\n\u003cp\u003eWhen the website is running, the main action starts when a user searches for a movie. FilmFlow sends the search request to the \u003cstrong\u003eTMDB API\u003c/strong\u003e, which provides movie information and search results.\u003c/p\u003e\n\u003cp\u003eAfter selecting a movie, FilmFlow uses the \u003cstrong\u003eWikipedia API\u003c/strong\u003e to find the movie's soundtrack information. The soundtrack data is then processed so that individual songs can be matched with tracks available on Spotify.\u003c/p\u003e\n\u003cp\u003eOnce the user connects their Spotify account, FilmFlow uses the \u003cstrong\u003eSpotify Web API\u003c/strong\u003e to create a playlist containing the soundtrack songs.\u003c/p\u003e\n\u003cp\u003eThis creates a multi-service workflow where each API has a specific responsibility:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTMDB\u003c/strong\u003e provides movie search and movie information.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWikipedia\u003c/strong\u003e provides soundtrack information.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSpotify\u003c/strong\u003e provides music search and playlist creation.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMongoDB\u003c/strong\u003e stores application and user information.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExpress\u003c/strong\u003e handles server-side requests and application logic.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReact\u003c/strong\u003e provides the interactive frontend.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003eMajor Features\u003c/h2\u003e\n\u003ch3\u003eUser Authentication\u003c/h3\u003e\n\u003cp\u003eFilmFlow includes email and password authentication so users can have accounts within the application. Authentication required managing user credentials and protecting information that should not be publicly accessible.\u003c/p\u003e\n\u003ch3\u003eMovie Search\u003c/h3\u003e\n\u003cp\u003eUsers can search for movies through TMDB rather than manually entering movie information. Search results provide a more convenient way to find the movie they want to use.\u003c/p\u003e\n\u003ch3\u003eSoundtrack Discovery\u003c/h3\u003e\n\u003cp\u003eAfter selecting a movie, FilmFlow retrieves soundtrack information through Wikipedia. This was particularly useful because soundtrack information is not provided directly by TMDB.\u003c/p\u003e\n\u003ch3\u003eSpotify Integration\u003c/h3\u003e\n\u003cp\u003eUsers can connect their Spotify account to FilmFlow. The application uses Spotify's API to search for tracks and create playlists on the user's account.\u003c/p\u003e\n\u003ch3\u003ePlaylist Creation\u003c/h3\u003e\n\u003cp\u003eThe final workflow is designed to require as little manual work as possible. After selecting a movie and connecting Spotify, users can create a playlist containing any of the songs from a single or multiple movie's soundtrack.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eTechnologies Used\u003c/h2\u003e\n\u003cp\u003eFilmFlow was built with the \u003cstrong\u003eMERN stack\u003c/strong\u003e and several external APIs.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eReact\u003c/strong\u003e — frontend interface and application state\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNode.js\u003c/strong\u003e — server-side JavaScript runtime\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExpress\u003c/strong\u003e — backend API and server framework\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMongoDB\u003c/strong\u003e — database for application data\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSpotify Web API\u003c/strong\u003e — Spotify authentication, track searching, and playlist creation\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTMDB API\u003c/strong\u003e — movie searching and movie information\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWikipedia API\u003c/strong\u003e — soundtrack information\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJavaScript\u003c/strong\u003e — primary programming language\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGit/GitHub\u003c/strong\u003e — version control and source management\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe project gave me experience working with a traditional client-server architecture while also integrating several third-party services into the same application.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eChallenges\u003c/h2\u003e\n\u003cp\u003eOne of the biggest challenges was integrating APIs that were designed for different purposes. TMDB provides structured movie data, while Wikipedia contains soundtrack information in a much less predictable format. Spotify then requires its own authentication process and specific information about tracks and playlists.\u003c/p\u003e\n\u003cp\u003eThe Spotify integration was another significant challenge because it required OAuth authentication. The application had to correctly handle the connection between the user's FilmFlow session and their Spotify account before it could make requests on their behalf.\u003c/p\u003e\n\u003cp\u003eAnother challenge was matching soundtrack information to Spotify tracks. Song titles and artist names do not always have identical formatting across different sources, so data retrieved from Wikipedia could not simply be passed directly to Spotify. The application needed to account for differences in how information was represented by each service.\u003c/p\u003e\n\u003cp\u003eWorking with authentication also reinforced the importance of configuration details. For example, Spotify requires the application's redirect URI to exactly match the URI registered with the Spotify developer application. Small configuration differences can prevent authentication from working correctly.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eWhat I Learned\u003c/h2\u003e\n\u003cp\u003eFilmFlow gave me practical experience building a full-stack application rather than working on the frontend or backend in isolation. I learned how the different parts of a MERN application communicate and how frontend actions can trigger backend requests and external API calls.\u003c/p\u003e\n\u003cp\u003eThe project also taught me more about working with third-party APIs. Documentation, authentication requirements, response formats, and error handling all become important when an application depends on services outside of its own codebase.\u003c/p\u003e\n\u003cp\u003eOAuth was another important area of learning. Integrating Spotify required understanding how an application obtains permission to interact with a user's account and how that authorization is used when making API requests.\u003c/p\u003e\n\u003cp\u003eMost importantly, FilmFlow showed me that API integration is not just about sending requests and receiving data. Different services often represent the same information differently, so building a reliable application requires transforming, validating, and connecting that data between systems.\u003c/p\u003e\n\u003ch3\u003eMicroservice Architecture\u003c/h3\u003e\n\u003cp\u003eFilmFlow was originally developed as a project for my Software Engineering 1 course at OSU, where the focus was on designing and implementing software that uses the microservices architecture. As such while the version of FilmFlow linked here does't use any of the original code from my peers microservices, there are features within the code on the server side that were based off of integrating microservice, this includes the movie bookmark functionality, the user feedback page, the password generator, and code that counts the number of songs in a playlist.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eReflection\u003c/h2\u003e\n\u003cp\u003eFilmFlow started as a relatively simple idea—turn a movie soundtrack into a Spotify playlist—but implementing that idea required several different technologies to work together. The project strengthened my experience with React, Express, MongoDB, authentication, and REST APIs while giving me a better understanding of how full-stack applications integrate with external services.\u003c/p\u003e\n\u003cp\u003eThe project also reflects my interest in building applications that combine engineering with usability. Rather than requiring users to understand how the underlying APIs work, FilmFlow hides that complexity behind a straightforward workflow: find a movie, discover its soundtrack, and create a playlist.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003eProject\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eRepository:\u003c/strong\u003e \u003ca href=\"https://github.com/mei-tate/FilmFlow\"\u003egithub.com/mei-tate/FilmFlow\u003c/a\u003e\u003c/p\u003e\n\u003ch2\u003e\u003cstrong\u003eAuthor:\u003c/strong\u003e Mei Tate\u003c/h2\u003e\n"}},"__N_SSG":true},"page":"/posts/[id]","query":{"id":"FilmFlow"},"buildId":"2onomkkxNiyKS0tNkiH6g","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
